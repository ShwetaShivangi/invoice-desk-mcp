# Loaded with MICRONAUT_ENVIRONMENTS=dev. Verifies token signatures against the
# identity provider's published keys (Keycloak by default, Auth0 via env vars).
micronaut:
  security:
    token:
      jwt:
        signatures:
          jwks:
            idp:
              url: ${OAUTH_JWKS_URI:`http://localhost:8180/realms/invoice-desk/protocol/openid-connect/certs`}
