services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin      # local dev only
      # Optional, experimental: native RFC 8707 resource indicators
      # KC_FEATURES: resource-indicators
    ports:
      - "8180:8080"
